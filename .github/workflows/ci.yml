name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      term:
        description: Optional Chico term override
        required: false
        type: string

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run update:data
      - run: bun run check
      - run: bun run lint
      - run: bun run test:unit -- --run
      - run: bun run test:e2e
      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: build

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep scheduled workflow active
        run: |
          if git log --since='28 days ago' --format='%s' | grep -Fx 'chore: keep scheduled workflow active' >/dev/null; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active"
          git push
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Update schedule data
        run: bun run update:data
        env:
          SCHEDULE_TERM: ${{ inputs.term }}
      - run: bun run check
      - run: bun run lint
      - run: bun run test:unit -- --run
      - run: bun run test:e2e
      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.build.result == 'success') ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.refresh.result == 'success'))
    needs: [build, refresh]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
